name: opto-sync real web application e2e

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'astro.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/opto-sync-real-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-web:
    uses: opto-sync/opto-sync-e2e/.github/workflows/real-web-app-reusable.yml@6dd42f988efedf74359c8fc1d0f7a1da82c1fdbd
    with:
      expect_offline_shell: false
